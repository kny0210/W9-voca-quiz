<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영어 단어 객관식 퀴즈</title>
    <!-- Supabase JavaScript v2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 500px;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            text-align: center;
            color: #2c3e50;
        }
        .progress {
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-bottom: 10px;
            text-align: right;
        }
        .word-box {
            font-size: 1.8rem;
            font-weight: bold;
            color: #2980b9;
            margin-bottom: 20px;
            text-align: center;
            background: #ecf0f1;
            padding: 15px;
            border-radius: 8px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        button.option-btn {
            background-color: #fff;
            border: 2px solid #bdc3c7;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }
        button.option-btn:hover:not(:disabled) {
            background-color: #3498db;
            border-color: #3498db;
            color: white;
        }
        button.option-btn:disabled {
            cursor: default;
        }
        button.option-btn.correct {
            background-color: #2ecc71 !important;
            border-color: #2ecc71 !important;
            color: white !important;
        }
        button.option-btn.incorrect {
            background-color: #e74c3c !important;
            border-color: #e74c3c !important;
            color: white !important;
        }
        .feedback {
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
            min-height: 24px;
        }
        .next-btn, .restart-btn {
            width: 100%;
            background-color: #2c3e50;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .next-btn:hover, .restart-btn:hover {
            background-color: #34495e;
        }
        .status-msg {
            font-size: 0.8rem;
            text-align: center;
            margin-top: 10px;
            color: #7f8c8d;
        }
        .hidden {
            display: none;
        }
        .score-box {
            text-align: center;
            font-size: 1.3rem;
            margin-bottom: 20px;
            font-weight: bold;
            color: #2c3e50;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>영어 단어 퀴즈</h1>

        <!-- 퀴즈 화면 -->
        <div id="quiz-screen">
            <div class="progress" id="progress-text">문제 1 / 3</div>
            <div class="word-box" id="word-display">abundant</div>
            <div class="options" id="options-container">
                <!-- 보기가 동적으로 들어갑니다 -->
            </div>
            <div class="feedback" id="feedback-text"></div>
            <button id="next-btn" class="next-btn hidden" onclick="handleNext()">다음 문제</button>
        </div>

        <!-- 결과 화면 -->
        <div id="result-screen" class="hidden">
            <div class="score-box" id="final-score"></div>
            <button class="restart-btn" onclick="startQuiz()">다시 풀기</button>
        </div>

        <div class="status-msg" id="status-msg"></div>
    </div>

    <script>
        // Supabase 설정 빈칸
        const SUPABASE_URL = "https://uyxkpkgnoxaolojlsekl.supabase.co";
        const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_mM8lrz8mtSEwy_nL5KJ8Mg_M_ikhSGH";

        // Supabase 클라이언트 초기화 (v2)
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        // 퀴즈 문제 데이터
        const quizData = [
            {
                question_no: 1,
                english_word: "abundant",
                options: ["조용한", "풍부한", "위험한", "느린"],
                answer: "풍부한"
            },
            {
                question_no: 2,
                english_word: "reluctant",
                options: ["주저하는", "열정적인", "정확한", "부지런한"],
                answer: "주저하는"
            },
            {
                question_no: 3,
                english_word: "brief",
                options: ["강력한", "평범한", "짧은", "불규칙한"],
                answer: "짧은"
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let attemptId = "";
        let questionStartTime = 0;
        let answeredCurrent = false;

        function startQuiz() {
            // 새로운 attempt_id 생성
            attemptId = crypto.randomUUID();
            currentQuestionIndex = 0;
            score = 0;

            document.getElementById("quiz-screen").classList.remove("hidden");
            document.getElementById("result-screen").classList.add("hidden");
            document.getElementById("status-msgtextContent = "");

            loadQuestion();
        }

        function loadQuestion() {
            answeredCurrent = false;
            const q = quizData[currentQuestionIndex];

            document.getElementById("progress-text").textContent = `문제 ${q.question_no} / 3`;
            document.getElementById("word-display").textContent = q.english_word;
            document.getElementById("feedback-text").textContent = "";
            document.getElementById("next-btn").classList.add("hidden");
            document.getElementById("status-msg").textContent = "";

            const optionsContainer = document.getElementById("options-container");
            optionsContainer.innerHTML = "";

            q.options.forEach(optionText => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.textContent = optionText;
                btn.onclick = () => selectOption(optionText, btn);
                optionsContainer.appendChild(btn);
            });

            // 문제 제시 후 타이머 시작
            questionStartTime = performance.now();
        }

        async function selectOption(selectedOption, clickedBtn) {
            if (answeredCurrent) return;
            answeredCurrent = true;

            const responseEndTime = performance.now();
            const responseTimeMs = Math.round(responseEndTime - questionStartTime);

            const q = quizData[currentQuestionIndex];
            const isCorrect = (selectedOption === q.answer);

            if (isCorrect) {
                score++;
                clickedBtn.classList.add("correct");
                document.getElementById("feedback-text").textContent = "정답입니다! 🎉";
                document.getElementById("feedback-text").style.color = "#2ecc71";
            } else {
                clickedBtn.classList.add("incorrect");
                document.getElementById("feedback-text").textContent = `틀렸습니다. 정답: ${q.answer}`;
                document.getElementById("feedback-text").style.color = "#e74c3c";

                // 정답 버튼도 초록색으로 표시
                const allBtns = document.querySelectorAll(".option-btn");
                allBtns.forEach(btn => {
                    if (btn.textContent === q.answer) {
                        btn.classList.add("correct");
                    }
                });
            }

            // 모든 보기 비활성화
            document.querySelectorAll(".option-btn").forEach(btn => btn.disabled = true);

            // Supabase에 데이터 INSERT (SELECT, UPDATE, DELETE 및 insert().select() 미사용)
            const payload = {
                attempt_id: attemptId,
                question_no: q.question_no,
                english_word: q.english_word,
                chosen_answer: selectedOption,
                is_correct: isCorrect,
                response_time_ms: responseTimeMs
            };

            const { error } = await supabaseClient
                .from('quiz_answers')
                .insert([payload]);

            if (error) {
                console.error("저장 오류:", error);
                document.getElementById("status-msg").textContent = "⚠️ 서버 저장에 실패했지만 퀴즈는 계속 진행됩니다.";
            } else {
                document.getElementById("status-msg").textContent = "💾 응답 저장 완료";
            }

            // 다음 문제 버튼 또는 결과 보기 버튼 표시
            const nextBtn = document.getElementById("next-btn");
            if (currentQuestionIndex < quizData.length - 1) {
                nextBtn.textContent = "다음 문제";
            } else {
                nextBtn.textContent = "결과 보기";
            }
            nextBtn.classList.remove("hidden");
        }

        function handleNext() {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById("quiz-screen").classList.add("hidden");
            document.getElementById("result-screen").classList.remove("hidden");
            document.getElementById("final-score").textContent = `퀴즈 완료! 총점: ${score} / 3점`;
            document.getElementById("status-msg").textContent = "";
        }

        // 최초 실행
        startQuiz();
    </script>
</body>
</html>
